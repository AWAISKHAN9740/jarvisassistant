<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>J.A.R.V.I.S.</title>
<style>
:root{--bg:#050a10;--pn:#0c1722;--ln:#1b3346;--ac:#5ee7ff;--tx:#dff4fa;--mu:#7fa0b0;--al:#ff6b4a;--ok:#6dffb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--ln)}
h1{font-size:18px;letter-spacing:.18em;margin:0;font-weight:600}
#st{margin-left:auto;font-size:13px;color:var(--ac);border:1px solid var(--ln);padding:4px 10px;border-radius:99px}
#reactor{width:64px;height:64px;flex:none;position:relative}
#reactor i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);opacity:.9}
#reactor i:nth-child(2){inset:10px;border-style:dashed;animation:sp 12s linear infinite}
#reactor i:nth-child(3){inset:22px;background:var(--ac);border:0;box-shadow:0 0 18px var(--ac)}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{50%{transform:scale(1.25);opacity:.5}}
body[data-s=listening] #reactor i:nth-child(3){animation:pu 1s infinite;background:var(--ok);box-shadow:0 0 18px var(--ok)}
body[data-s=thinking] #reactor i:nth-child(2){animation-duration:1.5s}
body[data-s=speaking] #reactor i:nth-child(3){animation:pu .45s infinite}
body[data-s=executing] #reactor i:nth-child(1){border-color:#ffd24a}
body[data-s=error] #reactor i{border-color:var(--al)}body[data-s=error] #reactor i:nth-child(3){background:var(--al);box-shadow:0 0 18px var(--al)}
@media(prefers-reduced-motion:reduce){#reactor i,#reactor i:nth-child(3){animation:none!important}}
#main{flex:1;overflow-y:auto}#log{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;border:1px solid var(--ln);background:var(--pn);white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;border-color:#2a5a73}
.m.j{align-self:flex-start}
.m small{display:block;color:var(--mu);font-size:11px;margin-bottom:2px}
.row{display:flex;gap:8px;padding:8px 14px}
.chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{min-height:48px;padding:0 16px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;white-space:nowrap}
button:active{background:#12293a}
button.p{border-color:var(--ac);color:var(--ac)}
button.d{border-color:var(--al);color:var(--al)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chips button{min-height:44px;font-size:14px}
input,select,textarea{min-height:48px;width:100%;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:0 12px}
#mic{width:56px;padding:0;font-size:22px}
#mic.on{background:var(--ok);color:#021;border-color:var(--ok)}
.cf{align-self:flex-start;display:flex;gap:8px}
#sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.o{display:flex}
#tabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--ln);overflow-x:auto}
#tabs button.a{border-color:var(--ac);color:var(--ac)}
#pane{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--ln);background:var(--pn);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:15px}
.mu{color:var(--mu);font-size:13px;margin:0}
.pr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pr b{flex:1;min-width:120px}
.g{color:var(--ok)}.n{color:var(--al)}
video{width:100%;border-radius:12px;background:#000;max-height:40vh}
label{font-size:13px;color:var(--mu)}

#dash{padding:8px 14px 0}
#wave{display:flex;gap:3px;align-items:center;justify-content:center;height:34px}
#wave i{width:4px;height:5px;background:var(--ac);border-radius:2px;opacity:.5}
@keyframes wv{to{height:26px;opacity:1}}
body[data-s=listening] #wave i,body[data-s=speaking] #wave i,body[data-s=thinking] #wave i{animation:wv .5s infinite alternate}
.live{display:flex;gap:10px;align-items:center;border:1px solid var(--al);border-radius:14px;padding:10px;background:#1b0e0e;margin:8px 0}
.live div{flex:1}.live p{margin:2px 0 0}
#tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
#tiles button{height:78px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;white-space:normal}
#tiles span{font-size:20px}#tiles small{color:var(--mu);font-size:10px}
#sugg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}#sugg button{min-height:44px;font-size:14px}
@media(prefers-reduced-motion:reduce){#wave i{animation:none!important}}
.row{min-width:0}.row button{min-width:0;padding:0 10px;white-space:normal;line-height:1.2}
#pane,#sheet{min-height:0}#pane>*{min-width:0;max-width:100%}
#send,#mic{flex:none}

body[data-s=waiting] #reactor i{border-color:#ffd24a}body[data-s=waiting] #reactor i:nth-child(3){background:#ffd24a;box-shadow:0 0 18px #ffd24a;animation:pu 1.6s infinite}
#st{transition:color .2s,border-color .2s}
body[data-s=listening] #st{color:var(--ok);border-color:var(--ok)}body[data-s=thinking] #st{color:#9db8ff}body[data-s=executing] #st,body[data-s=waiting] #st{color:#ffd24a;border-color:#ffd24a}body[data-s=error] #st{color:var(--al);border-color:var(--al)}
.m{animation:fi .18s ease-out}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
button{transition:background .12s,border-color .12s,transform .08s}button:active{transform:scale(.97)}
.ic{width:24px;height:24px;stroke:var(--ac);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cf{display:flex;gap:8px;margin:4px 0}.cf button{flex:1}
.rs{font-weight:700;font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.rs.PASS{color:var(--ok);border-color:var(--ok)}.rs.FAIL{color:var(--al);border-color:var(--al)}.rs.PERM{color:#ffd24a;border-color:#ffd24a}
#pane .pr button{white-space:normal;padding:0 6px;min-width:0;font-size:13px}
@media(max-width:340px){#pane .pr button{font-size:12px;padding:0 3px}}
body.lite *,body.lite *::before{animation:none!important;transition:none!important}
</style></head>

<div id="sheet"><div id="tabs"></div><div id="pane"></div><div class="row"><button id="close" style="flex:1" class="p">Close</button></div></div>


<script>"use strict";
const $=s=>document.querySelector(s);
const S={lang:'hg',rate:1,vol:1,sfx:true,provider:'OpenAI-compatible',endpoint:'',model:'',key:'',prompt:'You are J.A.R.V.I.S., a calm, concise personal assistant and coding helper. Reply in the user\'s language.'};
try{Object.assign(S,JSON.parse(localStorage.getItem('jv.s')||'{}'))}catch(e){}
const save=()=>{try{const c=Object.assign({},S);delete c.key;localStorage.setItem('jv.s',JSON.stringify(c))}catch(e){}};try{const o=JSON.parse(localStorage.getItem('jv.s')||'{}');if(o.key){delete o.key;localStorage.setItem('jv.s',JSON.stringify(o))}}catch(e){}
let notes=[];try{notes=JSON.parse(localStorage.getItem('jv.n')||'[]')}catch(e){}
const saveN=()=>{try{localStorage.setItem('jv.n',JSON.stringify(notes))}catch(e){}};
const ctx={last:null,pending:null,await:null};
const R={
ok:{en:'Sure.',hi:'जी Janab।',ur:'جی Janab۔',hg:'Ji Janab.'},
hello:{en:'JARVIS online. Say or type a command. Say "help" for the list.',hi:'JARVIS तैयार है। कमांड बोलिए या लिखिए। "help" बोलें।',ur:'JARVIS تیار ہے۔ حکم بولیں یا لکھیں۔',hg:'JARVIS ready hai. Command bolein ya likhein. "help" bolein.'},
bat:{en:'Battery is {p} percent{c}.',hi:'Janab, battery {p} percent है{c}।',ur:'Janab، بیٹری {p} فیصد ہے{c}۔',hg:'Janab, battery {p} percent hai{c}.'},
nobat:{en:'This browser does not expose battery data. The native Android version can read it.',hi:'यह browser battery data नहीं देता। Native Android version में यह संभव है।',ur:'یہ براؤزر بیٹری ڈیٹا نہیں دیتا۔ نیٹو اینڈرائیڈ ورژن میں ممکن ہے۔',hg:'Ye browser battery data nahi deta. Native Android version mein ye possible hai.'},
tOn:{en:'Torch is on.',hi:'टॉर्च चालू है।',ur:'ٹارچ آن ہے۔',hg:'Torch on hai.'},
tOff:{en:'Torch is off.',hi:'टॉर्च बंद है।',ur:'ٹارچ بند ہے۔',hg:'Torch off hai.'},
tFail:{en:'This browser or phone did not allow torch control. A native Android build is needed for reliable torch.',hi:'इस browser में torch control नहीं मिला। भरोसेमंद torch के लिए native Android चाहिए।',ur:'اس براؤزر میں ٹارچ کنٹرول نہیں ملا۔ نیٹو اینڈرائیڈ درکار ہے۔',hg:'Is browser mein torch control nahi mila. Reliable torch ke liye native Android chahiye.'},
cam:{en:'Opening the camera.',hi:'Camera खोल रहा हूँ।',ur:'کیمرہ کھول رہا ہوں۔',hg:'Camera khol raha hoon.'},
camAsk:{en:'Janab, camera access is needed. Shall I request permission? (yes / no)',hi:'Janab, camera access चाहिए। क्या मैं permission माँगूँ? (हाँ / नहीं)',ur:'Janab، کیمرہ ایکسیس چاہیے۔ کیا میں اجازت مانگوں؟ (ہاں / نہیں)',hg:'Janab, camera access chahiye. Kya main permission maangoon? (haan / nahi)'},
tq:{en:'How many minutes?',hi:'कितने मिनट का?',ur:'کتنے منٹ کا؟',hg:'Kitne minute ka?'},
tset:{en:'Timer set for {n} minute(s).',hi:'{n} minute का timer लगा दिया।',ur:'{n} منٹ کا ٹائمر لگا دیا۔',hg:'{n} minute ka timer laga diya.'},
tdone:{en:'Janab, your timer is finished.',hi:'Janab, आपका timer पूरा हो गया।',ur:'Janab، آپ کا ٹائمر مکمل ہو گیا۔',hg:'Janab, aapka timer poora ho gaya.'},
tcan:{en:'Timer cancelled.',hi:'Timer बंद कर दिया।',ur:'ٹائمر بند کر دیا۔',hg:'Timer band kar diya.'},
tnone:{en:'No timer is running.',hi:'कोई timer नहीं चल रहा।',ur:'کوئی ٹائمر نہیں چل رہا۔',hg:'Koi timer nahi chal raha.'},
alarm:{en:'Setting a real alarm needs the native Android app. I can run a timer here instead.',hi:'असली alarm के लिए native Android app चाहिए। यहाँ timer लगा सकता हूँ।',ur:'اصل الارم کے لیے نیٹو اینڈرائیڈ ایپ چاہیے۔ یہاں ٹائمر لگا سکتا ہوں۔',hg:'Asli alarm ke liye native Android app chahiye. Yahan timer laga sakta hoon.'},
nsave:{en:'Note saved.',hi:'Note सेव हो गया।',ur:'نوٹ محفوظ ہو گیا۔',hg:'Note save ho gaya.'},
nask:{en:'What should the note say?',hi:'Note में क्या लिखूँ?',ur:'نوٹ میں کیا لکھوں؟',hg:'Note mein kya likhoon?'},
nlist:{en:'Your notes:',hi:'आपके notes:',ur:'آپ کے نوٹس:',hg:'Aapke notes:'},
nnone:{en:'You have no notes.',hi:'कोई note नहीं है।',ur:'کوئی نوٹ نہیں ہے۔',hg:'Koi note nahi hai.'},
ndel:{en:'Last note deleted.',hi:'आखिरी note हटा दिया।',ur:'آخری نوٹ حذف کر دیا۔',hg:'Aakhri note delete kar diya.'},
dial:{en:'Janab, shall I open the dialer? It will not place any call. (yes / no)',hi:'Janab, क्या dialer खोलूँ? कोई call अपने आप नहीं होगी। (हाँ / नहीं)',ur:'Janab، کیا ڈائلر کھولوں؟ کوئی کال خود نہیں ہوگی۔ (ہاں / نہیں)',hg:'Janab, kya dialer kholoon? Koi call apne aap nahi hogi. (haan / nahi)'},
brow:{en:'Opening the browser.',hi:'Browser खोल रहा हूँ।',ur:'براؤزر کھول رہا ہوں۔',hg:'Browser khol raha hoon.'},
scr:{en:'Screen Vision requires the native Android version and your permission. Full device screen access requires the native Android version and your permission. This web version cannot see your screen.',hi:'पूरी device screen देखने के लिए native Android version और आपकी permission चाहिए। यह web version आपकी screen नहीं देख सकता।',ur:'پوری ڈیوائس اسکرین کے لیے نیٹو اینڈرائیڈ ورژن اور آپ کی اجازت چاہیے۔ یہ ویب ورژن آپ کی اسکرین نہیں دیکھ سکتا۔',hg:'Poori device screen dekhne ke liye native Android version aur aapki permission chahiye. Ye web version aapki screen nahi dekh sakta.'},
back:{en:'Android back/home actions need the native Accessibility service. Not available in the browser.',hi:'Back/home के लिए native Accessibility service चाहिए। Browser में नहीं है।',ur:'بیک/ہوم کے لیے نیٹو ایکسیسبیلٹی سروس چاہیے۔ براؤزر میں نہیں ہے۔',hg:'Back/home ke liye native Accessibility service chahiye. Browser mein nahi hai.'},
yes:{en:'Done.',hi:'हो गया।',ur:'ہو گیا۔',hg:'Ho gaya.'},
no:{en:'Cancelled.',hi:'रद्द कर दिया।',ur:'منسوخ کر دیا۔',hg:'Cancel kar diya.'},
stop:{en:'Stopped.',hi:'रोक दिया।',ur:'روک دیا۔',hg:'Rok diya.'},
live1:{en:'Live conversation started. I will keep listening after each reply.',hi:'Live बातचीत शुरू। हर जवाब के बाद मैं सुनता रहूँगा।',ur:'لائیو بات چیت شروع۔ ہر جواب کے بعد میں سنتا رہوں گا۔',hg:'Live baat shuru. Har jawab ke baad main sunta rahunga.'},
live0:{en:'Live conversation ended.',hi:'Live बातचीत खत्म।',ur:'لائیو بات چیت ختم۔',hg:'Live baat khatam.'},
nomic:{en:'Speech recognition is not supported in this browser. Use Chrome on Android, or type.',hi:'इस browser में speech recognition नहीं है। Android Chrome इस्तेमाल करें या लिखें।',ur:'اس براؤزر میں اسپیچ ریکگنیشن نہیں ہے۔ اینڈرائیڈ کروم استعمال کریں یا لکھیں۔',hg:'Is browser mein speech recognition nahi hai. Android Chrome use karein ya likhein.'},
micden:{en:'Microphone permission is disabled. Allow it from Tools & Security.',hi:'Microphone permission बंद है। इसे Security से allow करें।',ur:'مائیک کی اجازت بند ہے۔ سیکیورٹی سے اجازت دیں۔',hg:'Microphone permission disabled hai. Security se allow karein.'},
offl:{en:'Janab, the AI service is not configured or unavailable. Basic commands still work. Say "help".',hi:'Janab, AI service configure नहीं है या उपलब्ध नहीं। Basic commands चल रहे हैं। "help" बोलें।',ur:'Janab، AI سروس سیٹ نہیں یا دستیاب نہیں۔ بنیادی کمانڈز چل رہی ہیں۔ "help" بولیں۔',hg:'Janab, AI service configure nahi hai ya unavailable hai. Basic commands chal rahi hain. "help" bolein.'},
quota:{en:'The AI service returned an error (limit or key problem). Basic commands still work.',hi:'AI service में error आया (limit या key की दिक्कत)। Basic commands चल सकती हैं।',ur:'AI سروس میں خرابی آئی (حد یا کی کا مسئلہ)۔ بنیادی کمانڈز چل سکتی ہیں۔',hg:'AI service mein error aaya (limit ya key ki dikkat). Basic commands chal sakti hain.'},
help:{en:'Try: battery · torch on/off · open camera · 5 minute timer · note likho … · show notes · dialer · browser · screen · live conversation · stop.',hi:'बोलिए: battery · torch on/off · camera खोलो · 5 minute timer · note लिखो … · notes दिखाओ · dialer · browser · screen · live · stop।',ur:'بولیں: battery · torch on/off · camera · 5 minute timer · note لکھو … · notes · dialer · browser · screen · live · stop۔',hg:'Bolein: battery · torch on/off · camera kholo · 5 minute timer · note likho … · notes dikhao · dialer · browser · screen · live · stop.'},
vis:{en:'Camera analysis needs an AI vision service, which is not connected here. I can show the preview and capture a photo.',hi:'Camera analysis के लिए AI vision service चाहिए, जो यहाँ जुड़ी नहीं है। Preview और photo capture हो सकता है।',ur:'کیمرہ تجزیے کے لیے AI vision سروس چاہیے جو یہاں جڑی نہیں۔ پریویو اور فوٹو لے سکتا ہوں۔',hg:'Camera analysis ke liye AI vision service chahiye, jo yahan connected nahi hai. Preview aur photo capture ho sakta hai.'}
};
const LC={en:'en-US',hi:'hi-IN',ur:'ur-PK',hg:'en-IN'};
let cl=()=>S.lang;
const T=(k,p={})=>{let s=(R[k]||{})[cl()]||R[k].en;for(const a in p)s=s.replace('{'+a+'}',p[a]);return s};
// UI state
const setS=s=>{if(s==='idle'&&ctx.pending)s='waiting';document.body.dataset.s=s;$('#st').textContent=s.toUpperCase();};
const log=(who,txt)=>{const d=document.createElement('div');d.className='m '+(who==='u'?'u':'j');d.innerHTML='<small>'+(who==='u'?'YOU':'JARVIS')+'</small>';d.append(document.createTextNode(txt));$('#log').append(d);$('#main').scrollTop=1e9;return d};
// sound
let ac;const beep=(f,d=.08)=>{if(!S.sfx)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};
// TTS
let live=false,rec=null,listening=false,speaking=false;
function say(txt,after){log('j',txt);if(!('speechSynthesis'in window)){after&&after();return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=LC[cl()];u.rate=S.rate;u.volume=S.vol;
 u.onstart=()=>{speaking=true;setS('speaking')};
 u.onend=u.onerror=()=>{speaking=false;setS('idle');after&&after();if(live)listen()};
 try{speechSynthesis.speak(u)}catch(e){speaking=false;setS('error');after&&after();if(live)listen()}}
// STT
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){if(!SR){say(T('nomic'));live=false;upLive();return}
 if(listening||speaking)return;rec=new SR();rec.lang=LC[cl()];rec.interimResults=false;
